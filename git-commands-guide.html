    ["gh pr list", "يعرض قائمة طلبات السحب في المستودع الحالي لتسهيل متابعة الفروع والمراجعات.", "مبتدئ"],
    ["gh pr view <number>", "يعرض تفاصيل طلب سحب محدد، بما فيها الحالة والمراجعات ونتائج الفحوصات.", "متوسط"],
    ["gh pr view <number> --web", "يفتح صفحة طلب السحب المحدد في المتصفح عند الحاجة إلى التفاصيل الكاملة أو التعليقات.", "متوسط"],
    ["gh pr create --base main --head <branch-name> --title \"عنوان PR\" --body \"وصف مختصر\"", "ينشئ Pull Request من الفرع الحالي أو المحدد إلى main بعد دفع الفرع ومراجعة التغييرات.", "متوسط", "تأكد من اكتمال commit وpush ومن نجاح التحقق المحلي المطلوب قبل فتح PR."],
    ["gh run list", "يعرض عمليات GitHub Actions الحديثة وحالاتها لتتبع فحوصات CI.", "مبتدئ"],
    ["gh run view", "يعرض تفاصيل آخر تشغيل أو يتيح اختيار تشغيل محدد لمراجعة حالته.", "متوسط"],
    ["gh run view --log", "يعرض سجل GitHub Actions، وهو مفيد لقراءة سبب فشل CI وتحديد الخطوة المتعثرة.", "متوسط"],
    ["gh run view --web", "يفتح صفحة التشغيل في المتصفح لعرض تفاصيل Actions وسجلها الكامل.", "متوسط"],
    ["gh pr create --base main --head feature/startup-resume-error-state-sync --title \"Implement Stage 8 startup resume error-state sync\" --body \"Adds foreground cold-start and resume sync with error-state handling.\"", "مثال عملي في HudooriManager: بعد دفع فرع feature/startup-resume-error-state-sync، افتح PR بهذا الأمر أو ابدأ بـ gh pr status لفحص حالة PR الحالية.", "متوسط", "gh أداة GitHub الرسمية للتعامل مع PRs وchecks وActions وreviews؛ لا تغني عن git، الذي يبقى مسؤولًا عن commit وbranch وpush وpull. لا تضع tokens أو كلمات مرور داخل الأوامر. في مشروعنا نستخدم gh غالبًا للمراجعة وحالة PR، وليس لتجاوز خطوات التحقق."]
  ]]
];

const workflow = {
  title: "طريقة العمل على مشروع Git من البداية إلى الرفع",
  intro: "تسلسل عملي للمبتدئ: اختر السيناريو المناسب، نفّذ الأوامر بالترتيب، واستبدل URL واسم الفرع بالقيم الفعلية.",
  scenarios: [
    { title: "السيناريو الأول: مشروع جديد من الصفر", steps: [
      ["1", "أنشئ مجلد المشروع وانتقل إليه من الطرفية.", ["mkdir project-folder", "cd project-folder"]],
      ["2", "هيّئ Git. إن كانت هويتك غير مضبوطة على الجهاز، اضبط الاسم والبريد مرة واحدة.", ["git init", "git config --global user.name \"Your Name\"", "git config --global user.email \"email@example.com\""]],
      ["3", "راجع الحالة، جهّز الملفات، ثم أنشئ أول commit.", ["git status", "git add .", "git commit -m \"Initial commit\""]],
      ["4", "سمِّ الفرع الرئيسي main، اربط الريموت، ثم ارفع المشروع لأول مرة.", ["git branch -M main", "git remote add origin URL", "git push -u origin main"]]
    ]},
    { title: "السيناريو الثاني: مشروع موجود تم نسخه من GitHub", steps: [
      ["1", "انسخ المستودع وانتقل إلى مجلده.", ["git clone URL", "cd project-folder"]],
      ["2", "تحقق من الحالة وأنشئ فرعًا للعمل على ميزة أو مهمة مستقلة.", ["git status", "git switch -c feature/name"]],
      ["3", "نفّذ تعديلاتك، ثم جهزها واحفظها برسالة تصف ما فعلته.", ["git add -A", "git commit -m \"وصف التغيير\""]],
      ["4", "ارفع فرع الميزة ليصبح متاحًا للمراجعة أو فتح Pull Request.", ["git push -u origin feature/name"]]
    ]},
    { title: "دورة العمل اليومية المقترحة", steps: [
      ["1", "ابدأ بمعرفة الحالة واجلب آخر تحديثات الفرع قبل العمل.", ["git status", "git pull --rebase"]],
      ["2", "أنشئ فرع المهمة ثم عدّل الملفات المطلوبة.", ["git switch -c feature/task-name"]],
      ["3", "راجع الفرق واختر ما تريد تجهيزه بدقة أو جهز جميع التغييرات.", ["git diff", "git add -p", "git add -A"]],
      ["4", "احفظ رسالة واضحة ثم ارفع فرع المهمة.", ["git commit -m \"رسالة واضحة\"", "git push -u origin feature/task-name"]]
    ]}
  ],
  safety: ["git status", "git diff", "git log --oneline -5", "git stash"]
};

function levelClass(level){ return level === "خطر" ? "level-danger" : level === "متقدم" ? "level-advanced" : level === "متوسط" ? "level-mid" : "level-basic"; }
function escapeHtml(value){ return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
const content = document.getElementById("content");
sections.forEach(([title, commands], index) => {
  const cards = commands.map(([cmd, desc, level, note]) => `
    <div class="col command-wrap" data-search="${escapeHtml((title + " " + cmd + " " + desc + " " + level + " " + (note || "")).toLowerCase())}">
      <article class="card command-card h-100 p-3">
        <div class="d-flex justify-content-between align-items-center mb-2 gap-2"><span class="badge ${levelClass(level)}">${level}</span><button class="btn btn-sm btn-outline-primary copy" type="button" data-command="${escapeHtml(cmd)}">نسخ</button></div>
        <div class="cmd mb-3"><code>${escapeHtml(cmd)}</code></div>
        <p class="mb-0 text-secondary">${escapeHtml(desc)}</p>
        ${note ? `<p class="note rounded p-2 mt-3 mb-0"><strong>تحذير:</strong> ${escapeHtml(note)}</p>` : ""}
      </article>
    </div>`).join("");
  content.insertAdjacentHTML("beforeend", `
    <section id="section-${index + 1}" class="section mb-4" data-title="${escapeHtml(title)}">
      <div class="card section-card p-4"><div class="d-flex align-items-baseline justify-content-between gap-3 mb-3"><h2 class="h4 fw-bold mb-0">${index + 1}. ${escapeHtml(title)}</h2><span class="section-count">${commands.length} أوامر</span></div><div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">${cards}</div></div>
    </section>`);
});

const workflowCards = workflow.scenarios.map(scenario => `
  <article class="col-12 workflow-wrap" data-search="${escapeHtml((workflow.title + " " + scenario.title + " " + scenario.steps.flat().join(" ")).toLowerCase())}">
    <div class="card command-card p-3 p-md-4"><h3 class="h5 fw-bold mb-4">${escapeHtml(scenario.title)}</h3>
      <div class="vstack gap-3">${scenario.steps.map(([number, description, commands]) => `
        <div class="workflow-step pe-3"><div class="d-flex gap-2 align-items-start mb-2"><span class="step-number flex-shrink-0">${number}</span><p class="mb-0 pt-1">${escapeHtml(description)}</p></div>
          <div class="row row-cols-1 row-cols-lg-2 g-2">${commands.map(cmd => `<div class="col"><div class="cmd d-flex align-items-center justify-content-between gap-2 py-2"><code>${escapeHtml(cmd)}</code><button class="btn btn-sm btn-light copy flex-shrink-0" type="button" data-command="${escapeHtml(cmd)}">نسخ</button></div></div>`).join("")}</div>
        </div>`).join("")}</div>
    </div>
  </article>`).join("");
content.insertAdjacentHTML("beforeend", `
  <section id="section-workflow" class="section workflow-section mb-4" data-title="${escapeHtml(workflow.title)}">
    <div class="card section-card p-4"><div class="mb-4"><h2 class="h4 fw-bold mb-2">16. ${escapeHtml(workflow.title)}</h2><p class="text-secondary mb-0">${escapeHtml(workflow.intro)}</p></div>
      <div class="row g-3">${workflowCards}</div>
      <aside class="workflow-warning rounded-3 p-3 mt-4"><h3 class="h6 fw-bold mb-2">قبل تنفيذ أوامر خطرة</h3><p class="mb-2">افحص الحالة والفرق والتاريخ القريب، وخذ نسخة احتياطية أو خزّن عملك مؤقتًا قبل أي إجراء لا يمكن التراجع عنه بسهولة.</p><div class="d-flex flex-wrap gap-2 mb-2">${workflow.safety.map(cmd => `<div class="cmd py-2 px-2"><code>${escapeHtml(cmd)}</code> <button class="btn btn-sm btn-outline-primary copy ms-1" type="button" data-command="${escapeHtml(cmd)}">نسخ</button></div>`).join("")}</div><p class="mb-0 text-danger-emphasis"><strong>تجنب:</strong> <code>git reset --hard</code> و<code>git clean -fd</code> إلا بعد التأكد الكامل.</p></aside>
    </div>
  </section>`);

const nav = document.querySelector("#section-nav .nav");
[...sections.map(([title], index) => [title, `section-${index + 1}`]), [workflow.title, "section-workflow"]].forEach(([title, id]) => {
  nav.insertAdjacentHTML("beforeend", `<a class="nav-link" href="#${id}">${escapeHtml(title)}</a>`);
});

document.addEventListener("click", async (event) => {
  const button = event.target.closest(".copy"); if (!button) return;
  try { await navigator.clipboard.writeText(button.dataset.command); }
  catch { const area = document.createElement("textarea"); area.value = button.dataset.command; document.body.appendChild(area); area.select(); document.execCommand("copy"); area.remove(); }
  const original = button.textContent; button.textContent = "تم النسخ"; button.classList.replace("btn-outline-primary", "btn-success");
  setTimeout(() => { button.textContent = original; button.classList.replace("btn-success", "btn-outline-primary"); }, 1200);
});
document.getElementById("search").addEventListener("input", (event) => {
  const query = event.target.value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll(".section").forEach(section => { let visible = 0; section.querySelectorAll(".command-wrap, .workflow-wrap").forEach(card => { const match = !query || card.dataset.search.includes(query); card.style.display = match ? "" : "none"; if (match) visible++; }); section.style.display = visible ? "" : "none"; shown += visible; });
  document.getElementById("empty").classList.toggle("d-none", shown !== 0);
});
const backToTop = document.getElementById("back-to-top");
window.addEventListener("scroll", () => backToTop.classList.toggle("is-visible", window.scrollY > 360), { passive: true });
backToTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
</script>
</body>
</html>
