        function updateGlobalFields() {
            const schoolVal = document.getElementById('globalSchool').value || '............................';
            const principalVal = document.getElementById('globalPrincipal').value || '....................';
            const dateVal = document.getElementById('globalDate').value || '  /   /  1445 هـ';
            const dayVal = document.getElementById('globalDay').value || '............';

            document.querySelectorAll('.school-name-disp').forEach(el => el.textContent = schoolVal);
            document.querySelectorAll('.principal-disp').forEach(el => el.textContent = principalVal);
            document.querySelectorAll('.date-disp').forEach(el => el.textContent = dateVal);
            document.querySelectorAll('.day-disp').forEach(el => el.textContent = dayVal);
        }

        function filterDecisions() {
            const selectedVal = document.getElementById('decisionFilter').value;
            const allPages = document.querySelectorAll('.a4-page');

            allPages.forEach(page => {
                if (selectedVal === 'all') {
                    page.style.display = 'flex';
                } else {
                    if (page.id === `decision-page-${selectedVal}`) {
                        page.style.display = 'flex';
                    } else {
                        page.style.display = 'none';
                    }
                }
            });
        }

        // Initialize on DOM load
        window.onload = function() {
            renderDecisions();
            updateGlobalFields();
        };
    </script>
